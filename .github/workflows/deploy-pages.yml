name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ใช้ npm install ไม่ใช่ npm ci เพราะ lock สร้างจากเครื่อง Windows
      # ซึ่ง npm ไม่เขียนแพ็กเกจ optional ของ Linux ลงไป (@emnapi/*)
      # ทำให้ npm ci ปฏิเสธว่า lock ไม่ตรงกับ package.json
      - run: npm install

      - run: npx tsc --noEmit

      - run: npm run lint

      - name: Build static site
        run: node scripts/build-pages.mjs
        env:
          # Pages เสิร์ฟที่ /<ชื่อ repo> ไม่ใช่ราก ถ้าไม่ตั้งค่านี้ CSS กับ JS จะ 404
          PAGES_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
